<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="header">
        <div class="header-containerdiv">
            <div class="header-title">
                <h2>Online Store</h2>
            </div>
            <nav class="header-nav">
                <ul class="header-nav-list">
                    <li><a href=""><button>Main</button></a></li>
                    <li><a href=""><button>Production</button></a></li>
                    <li><a href=""><button>Contact</button></a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="main-header">
            <h1>Affordable, High Quality, Fast Shipping.</h1>
        </div>
        <div class="main-text">
            <p>Here at Online Store, We prioritize customer satisfaction over immense profits, providing you quality at good prices.</p>
        </div>
        <div class="main-cards">
            <div class="main-card">
                <div class="main-card-image">
                    <img src="https://kiabi.ge/cdn/shop/products/VX847_5_ZC1.jpg?v=1733995892"
                    alt="t-shirt">
                </div>
                <div class="main-card-info">
                    <div class="main-card-info-header">
                        <h3>Plain black T-Shirt</h3>
                    </div>
                    <div class="main-card-info-price">
                        <p>$759</p>
                    </div>
                    <div class="main-card-info-button">
                        <a href=""><button>Buy Now</button></a>
                    </div>
                </div>
            </div>
            <div class="main-card">
                <div class="main-card-image">
                    <img src="https://cdn02.plentymarkets.com/rm2ukznxe8l9/frontend/Bilddatenbank/Kategorieseiten/Holzspielzeug/10018296-PKW-natur-m--1-Maennlein.jpeg"
                    alt="woodencar">
                </div>
                <div class="main-card-info">
                    <div class="main-card-info-header">
                        <h3>Toy Car</h3>
                    </div>
                    <div class="main-card-info-price">
                        <p>$4.5K</p>
                    </div>
                    <div class="main-card-info-button">
                        <a href=""><button>Buy Now</button></a>
                    </div>
                </div>
            </div>
            <div class="main-card">
                <div class="main-card-image">
                    <img src="https://techresearchonline.com/_next/image/?url=https%3A%2F%2Ftechresearchonline.com%2Fmedia%2Fnews%2Fimages%2F1792145408_tesla-flying-car-1200x675.webp&w=3840&q=75"
                    alt="teslaroadster">
                </div>
                <div class="main-card-info">
                    <div class="main-card-info-header">
                        <h3>Tesla Roadster</h3>
                    </div>
                    <div class="main-card-info-price">
                        <p>$1.99</p>
                    </div>
                    <div class="main-card-info-button">
                        <a href=""><button>Buy Now</button></a>
                    </div>
                </div>
            </div>
            <div class="main-card">
                <div class="main-card-image">
                    <img src="https://paperwhisper.com/cdn/shop/files/uni-ball-one-p-gel-pen-692777.jpg?v=1723237559&width=1946"
                    alt="pen">
                </div>
                <div class="main-card-info">
                    <div class="main-card-info-header">
                        <h3>Pen</h3>
                    </div>
                    <div class="main-card-info-price">
                        <p>$6M </p>
                    </div>
                    <div class="main-card-info-button">
                        <a href=""><button>Buy Now</button></a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-container">
            <div class="footer-container-contacts">
                <div class="footer-contact"><p>Contact us here:</p></div>
                <div class="footer-contact"><p>112</p></div>
            </div>
            <div class="footer-container-socials">
                <div class="footer-social"><a href="https://www.instagram.com">Instagram</a></div>
                <div class="footer-social"><a href="https://www.facebook.com">Facebook</a></div>
            </div>
        </div>
    </footer>
</body>
</html>
